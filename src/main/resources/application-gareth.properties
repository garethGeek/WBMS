spring.application.name=wbms
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/wbms_db
spring.datasource.username=wbms
spring.datasource.password=${WBMS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=wbms
spring.flyway.schemas=wbms

# WBMS - capture behavior
wbms.capture.mode=ON_DEMAND
# ON_DEMAND  = only read from the port the user selected
# MULTI      = read from multiple ports at the same time (all active machines)

wbms.capture.read-timeout-ms=2000
wbms.capture.reconnect.enabled=true
wbms.capture.reconnect.delay-ms=3000

# Serial defaults (used when machine does not override)
wbms.serial.defaults.baud-rate=9600
wbms.serial.defaults.data-bits=8
wbms.serial.defaults.stop-bits=1
wbms.serial.defaults.parity=NONE
wbms.serial.defaults.flow-control=NONE

# TCP defaults (used when machine does not override)
wbms.tcp.defaults.connect-timeout-ms=3000
wbms.tcp.defaults.read-timeout-ms=5000
